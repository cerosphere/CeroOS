<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Soft Indigo Glow -->
    <filter id="ceroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Teal Glow for Signal -->
    <filter id="signalGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B6EF5"/>
      <stop offset="100%" stop-color="#3B4DB8"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17E8C4"/>
      <stop offset="100%" stop-color="#00D2B4"/>
    </linearGradient>
  </defs>

  <!-- Globe Structure / Orbit Lines (Indigo #5B6EF5) -->
  <g stroke="#5B6EF5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer Globe Circle -->
    <circle cx="60" cy="60" r="44" stroke-width="2.2" stroke-opacity="0.85"/>
    
    <!-- Longitude Ellipses -->
    <ellipse cx="60" cy="60" rx="24" ry="44" stroke-width="1.8" stroke-opacity="0.75"/>
    <ellipse cx="60" cy="60" rx="44" ry="18" stroke-width="1.6" stroke-opacity="0.55" transform="rotate(-15 60 60)"/>
    
    <!-- Inner Axis / Latitude Orbit -->
    <ellipse cx="60" cy="60" rx="43" ry="16" stroke-width="1.8" stroke-opacity="0.8" transform="rotate(15 60 60)"/>
  </g>

  <!-- Network Signal Waveform across Equator (Teal #17E8C4) -->
  <g filter="url(#signalGlow)">
    <!-- Signal Wave Path -->
    <path d="M 17 68 C 28 68, 34 40, 46 44 C 56 47, 60 76, 74 72 C 86 68, 92 48, 103 52" 
          fill="none" 
          stroke="url(#tealGrad)" 
          stroke-width="3.2" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Connection Node Dots on Signal -->
    <circle cx="18" cy="68" r="3.5" fill="#17E8C4" stroke="#090D16" stroke-width="1.5"/>
    <circle cx="46" cy="44" r="4.2" fill="#FFFFFF" stroke="#17E8C4" stroke-width="2"/>
    <circle cx="74" cy="72" r="4.2" fill="#FFFFFF" stroke="#17E8C4" stroke-width="2"/>
    <circle cx="102" cy="52" r="3.5" fill="#17E8C4" stroke="#090D16" stroke-width="1.5"/>
  </g>
</svg>
